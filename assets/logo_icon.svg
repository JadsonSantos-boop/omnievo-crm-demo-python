<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Gradiente Linear Púrpura -> Azul -> Ciano -> Verde -->
    <linearGradient id="cubeGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="35%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#10B981" />
    </linearGradient>

    <!-- Gradiente de Brilho do Núcleo Esmeralda -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#059669" />
    </radialGradient>

    <!-- Sombra e Glow do Cubo -->
    <filter id="cubeShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#6366F1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Cubo Isométrico 3D com Núcleo Central -->
  <g filter="url(#cubeShadow)">
    <!-- Contorno Hexagonal Externo -->
    <polygon points="60,16 100,39 100,85 60,108 20,85 20,39" 
             fill="none" 
             stroke="url(#cubeGradient)" 
             stroke-width="7" 
             stroke-linecap="round" 
             stroke-linejoin="round"/>

    <!-- Arestas Internas Radiando do Centro -->
    <line x1="60" y1="62" x2="60" y2="16" stroke="url(#cubeGradient)" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="62" x2="100" y2="85" stroke="url(#cubeGradient)" stroke-width="6" stroke-linecap="round"/>
    <line x1="60" y1="62" x2="20" y2="85" stroke="url(#cubeGradient)" stroke-width="6" stroke-linecap="round"/>

    <!-- Esfera do Núcleo Central Esmeralda -->
    <circle cx="60" cy="62" r="13" fill="url(#coreGlow)" />
    <circle cx="57" cy="59" r="4" fill="#A7F3D0" opacity="0.7"/>
  </g>
</svg>
